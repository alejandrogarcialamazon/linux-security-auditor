name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python security_auditor.py --help
      - run: python tools/build_pdf.py docs/MANUAL.md /tmp/MANUAL.pdf
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['ubuntu:24.04', 'debian:12-slim']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable integration environment
        run: |
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends python3 openssh-server
          install -d -m 0755 /run/sshd
      - run: python3 -m unittest discover -s tests -v
      - run: python3 integration/vm_checks.py --fixtures-only
